name: dispusip

x-app-env: &app-env
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-dispusip}
  DB_USERNAME: ${DB_USERNAME:-dispusip}
  DB_PASSWORD: ${DB_PASSWORD:-dispusip-secret}

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: dispusip-app
    restart: unless-stopped
    environment:
      <<: *app-env
      SEED_ON_FIRST_RUN: ${SEED_ON_FIRST_RUN:-true}
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-dispusip}
      MYSQL_USER: ${DB_USERNAME:-dispusip}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dispusip-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-dispusip-root}
      TZ: Asia/Makassar
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-dispusip-root}"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Builds the Tailwind/Vite assets once into public/build, then exits.
  node:
    image: node:22-alpine
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    environment:
      npm_config_cache: /tmp/.npm
    volumes:
      - ./:/var/www/html
    command: sh -c "npm install --no-audit --no-fund && npm run build"

  # Vite dev server with hot reload: docker compose --profile dev up vite
  vite:
    image: node:22-alpine
    profiles: ["dev"]
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    environment:
      npm_config_cache: /tmp/.npm
    ports:
      - "5173:5173"
    volumes:
      - ./:/var/www/html
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"

volumes:
  dbdata:
