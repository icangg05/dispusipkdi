date.timezone = Asia/Makassar
memory_limit = 256M
; 150 MB admin upload ceiling (SiteSettings::BATAS_UNGGAH_MAKS_MB), plus room for the form fields.
upload_max_filesize = 150M
post_max_size = 160M
max_execution_time = 60
expose_php = Off

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
