name: Deploy ke VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -e
            cd /var/www/dispusipkdi

            # Semua perintah di bawah memakai compose produksi, bukan docker-compose.yml
            # (yang itu dev: bind mount kode, mysql terbuka ke :3307, service node/vite).
            export COMPOSE_FILE=compose.prod.yml

            echo "==> Sinkron kode dengan origin/main..."
            # reset --hard, bukan pull: perbaikan darurat yang sempat diterapkan
            # langsung di server tidak boleh membuat deploy macet karena konflik.
            # Berkas untracked (.env, storage/app) tidak tersentuh.
            git fetch --prune origin main
            git reset --hard origin/main

            # Kode, vendor/ dan aset dibakar ke dalam image (stage `production` dan `web`
            # di docker/php/Dockerfile), tidak di-mount. Karena itu `--build` wajib: tanpa
            # itu kontainer lama terus jalan dengan kode lama tanpa satu pun galat.
            # Migrasi dan `artisan optimize` dijalankan entrypoint kontainer app setiap
            # kali kontainer dibuat, setelah .env terpasang; tidak diulang di sini agar
            # tidak ada dua migrasi yang berjalan bersamaan.
            echo "==> Bangun image dan jalankan..."
            docker compose up -d --build --remove-orphans

            echo "==> Tunggu aplikasi siap..."
            # Port hanya terikat ke 127.0.0.1:8010; yang menghadap internet nginx host
            # (dispusip.ilmifaizan.cloud). Entrypoint migrasi dulu, jadi beri waktu.
            for i in $(seq 1 60); do
              if curl -fsS -o /dev/null http://127.0.0.1:8010/up; then
                echo "Aplikasi merespons."
                break
              fi
              if [ "$i" = "60" ]; then
                echo "Aplikasi tidak merespons setelah 120 detik." >&2
                docker compose logs --tail=50 app >&2
                exit 1
              fi
              sleep 2
            done

            echo "==> Bersihkan image lama..."
            # Tiap deploy dengan --build meninggalkan image dangling; di VPS kecil
            # ini yang diam-diam menghabiskan disk.
            docker image prune -f

            docker compose ps
            df -h /
            echo "Done!"
