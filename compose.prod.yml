# Production. The code, vendor/ and built assets are baked into the images (docker/php/Dockerfile);
# only .env and storage/ (uploads, logs, sessions' files, the seed marker) come from the host.
#
#   COMPOSE_FILE=compose.prod.yml docker compose up -d --build
#
# The site answers on 127.0.0.1:${APP_PORT}; nginx on the host terminates HTTPS and proxies to it.
# On start the app container migrates, seeds once (SEED_ON_FIRST_RUN) and caches config, routes and views.
name: dispusip

x-app-env: &app-env
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-dispusip}
  DB_USERNAME: ${DB_USERNAME:-dispusip}
  DB_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di .env}

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    image: dispusip-app:production
    restart: unless-stopped
    environment:
      <<: *app-env
      SEED_ON_FIRST_RUN: ${SEED_ON_FIRST_RUN:-true}
      OPTIMIZE_ON_START: "true"
    volumes:
      - ./.env:/var/www/html/.env:ro
      - ./storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
    image: dispusip-web:production
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8010}:80"
    volumes:
      - ./storage/app/public:/var/www/html/storage/app/public:ro
    depends_on:
      - app

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-dispusip}
      MYSQL_USER: ${DB_USERNAME:-dispusip}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Isi DB_ROOT_PASSWORD di .env}
      TZ: Asia/Makassar
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  dbdata:
